name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v3
        with:
          issue_message: "Thank you for your interest in improving TCC."
          pr_message: "Thank you for your interest in improving TCC."
